<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katyayani Upadhyay — AI/ML & Data Science Engineer</title>
    <meta
      name="description"
      content="Katyayani Upadhyay: AI/ML and Data Science Engineer building agentic GenAI systems and the data pipelines that keep them trustworthy."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1318" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ec" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:title" content="Katyayani Upadhyay" />
    <meta property="og:description" content="Engineering AI that acts, not just answers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio-delta-sand-89.vercel.app/" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var param = new URLSearchParams(location.search).get('theme');
          var stored = param === 'light' || param === 'dark' ? param : localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* light is the default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
